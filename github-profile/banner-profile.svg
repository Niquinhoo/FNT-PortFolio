<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Nicolás Triberti — Full Stack Developer</title>
  <desc id="desc">Nicolás Triberti: Backend, Cloud y Automation. Una órbita y pulsos suaves representan ciclos de automatización.</desc>
  <style>
    .orbit { animation: orbit 24s linear infinite; }
    .pulse { animation: pulse 6s ease-out infinite; }
    .pulse-delayed { animation-delay: -3s; }
    .core { animation: heartbeat 3s ease-in-out infinite; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes pulse {
      from { transform: scale(1); opacity: .24; }
      to { transform: scale(2.04545); opacity: 0; }
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.12); opacity: .75; }
    }
    @media (prefers-reduced-motion: reduce) {
      .orbit, .pulse, .core { animation: none; }
      .pulse { opacity: 0; }
    }
  </style>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#111111" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFBFA"/>
      <stop offset="1" stop-color="#F2F2F0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#fade)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <path d="M0 560H1280" stroke="#111111" stroke-opacity=".12"/>
  <path d="M56 0V640M1224 0V640" stroke="#111111" stroke-opacity=".08"/>
  <circle cx="1050" cy="310" r="180" fill="none" stroke="#D90429" stroke-opacity=".12" stroke-width="1"/>
  <circle cx="1050" cy="310" r="134" fill="none" stroke="#D90429" stroke-opacity=".2" stroke-width="1"/>
  <circle cx="1050" cy="310" r="88" fill="#FDEBEC" stroke="#D90429" stroke-opacity=".35" stroke-width="1"/>
  <g transform="translate(1050 310)">
    <g fill="none" stroke="#D90429" stroke-width="1">
      <circle class="pulse" r="88" opacity="0"/>
      <circle class="pulse pulse-delayed" r="88" opacity="0"/>
    </g>
    <g class="orbit">
      <path d="M0-134A134 134 0 0 1 134 0" fill="none" stroke="#D90429" stroke-opacity=".45" stroke-width="1.5" stroke-linecap="round"/>
      <circle cy="-134" r="4" fill="#D90429"/>
    </g>
    <circle class="core" r="9" fill="#D90429"/>
  </g>
  <path d="M870 310h-44m404 0h44M1050 130V82m0 456v-48" stroke="#D90429" stroke-opacity=".35" stroke-width="1"/>
  <circle cx="826" cy="310" r="4" fill="#D90429"/>
  <circle cx="1274" cy="310" r="4" fill="#D90429"/>
  <text x="96" y="174" fill="#D90429" font-family="monospace, sans-serif" font-size="30" letter-spacing="4">FULL STACK DEVELOPER · ARGENTINA</text>
  <text x="92" y="340" fill="#111111" font-family="Georgia, 'Times New Roman', serif" font-size="100" letter-spacing="-3">Nicolás <tspan fill="#D90429" font-style="italic">Triberti</tspan></text>
  <path d="M96 394h92" stroke="#D90429" stroke-width="3"/>
  <text x="96" y="476" fill="#787774" font-family="monospace, sans-serif" font-size="32" letter-spacing="2">BACKEND / CLOUD / AUTOMATION</text>
</svg>
